[package]
name = "halod"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base32 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
moq-native-ietf = "0.11.0"
moq-sub = "0.5.0"
moq-transport = "0.17.0"
rand = "0.8"
tokio = { version = "1.54.1", features = ["full", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
